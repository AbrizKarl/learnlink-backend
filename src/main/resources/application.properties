# Setup JDBC connection (the database is created automatically if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/db_learnlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Setup db login credentials
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
# Auto create/update tables based on entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hide stack trace in error responses
server.error.include-stacktrace=never
server.port=8080
spring.application.name=learnlink